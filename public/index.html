<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Chantier</title>
<meta name="description" content="Planning des techniciens sur les chantiers">
<meta name="theme-color" content="#1C1313">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Planning">
<link rel="icon" href="logo-sygmatel.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo-plate"><img src="logo-sygmatel.png" alt="Sygmatel"></span>
    <div><strong>Planning Chantier</strong><span>Techniciens</span></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="tech"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 21a8 8 0 0 1 16 0"/></svg><span>Par technicien</span></button>
    <button data-view="site"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg><span>Par chantier</span></button>
    <button data-view="me"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M8 14h3"/></svg><span>Mon planning</span></button>
    <button data-view="res"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Ressources</span></button>
  </nav>
  <div class="sync" id="sync"><i></i><span></span></div>
</header>

<section class="toolbar" id="toolbar">
  <div class="tb-group">
    <button class="btn icon" id="prev" title="Période précédente (←)">‹</button>
    <button class="btn" id="today">Aujourd'hui</button>
    <button class="btn icon" id="next" title="Période suivante (→)">›</button>
  </div>
  <div class="range" id="range"></div>
  <div class="tb-group right">
    <select id="cat" title="Catégorie de techniciens" aria-label="Catégorie" hidden></select>
    <select id="weeks" title="Durée affichée">
      <option value="1">1 semaine</option>
      <option value="2">2 semaines</option>
      <option value="4">4 semaines</option>
    </select>
    <label class="chk"><input type="checkbox" id="weekend"> Week-end</label>
    <input type="search" id="filter" placeholder="Filtrer…" aria-label="Filtrer">
    <button class="btn ghost" id="csv" title="Exporter la période en CSV (Excel)">CSV</button>
    <button class="btn ghost" id="print">Imprimer</button>
    <button class="btn primary" id="add">+ Intervention</button>
  </div>
</section>

<main id="view"></main>
<button class="fab" id="fab" aria-label="Nouvelle intervention" hidden>+</button>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
